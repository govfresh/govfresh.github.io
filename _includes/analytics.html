{% assign google_analytics_id = site.data.site.analytics.google %}
{% if jekyll.environment == "production" and google_analytics_id %}
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id={{ google_analytics_id }}"></script>
  <script src="{{ site.baseurl }}/js/analytics.js" defer></script>
{% endif %}
