<div class="card h-100"><div class="card-body">
  {% if item.img %}
    <img
      class="rounded-circle sm mb-4 shadow-lg border"
      src="{{ site.baseurl }}/assets/img/{{ item.img-path }}/{{ item.img }}"
      alt="{{ item.img-alt }}">
  {% endif %}
  {% if item.name %}
    <h2 class="h4">
      <a href="{{ site.baseurl }}{{ item.url }}" class="card-link">{{ item.name | join: ", " }}</a>
    </h2>
  {% endif %}
  {% if item.description %}
    <p class="card-description">
      {{ item.description }}
    </p>
  {% endif %}
</div></div>
