<nav class="navbar navbar-expand-lg" id="nav" aria-label="Primary navigation">
  <div class="container">
    <a class="navbar-brand" href="{{ site.baseurl }}/" aria-label="{{ site.title }}">
      {% if site.logo %}{% include {{ site.logo }} %}{% else %}{{ site.title }}{% endif %}
    </a>
    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#siteNavCollapse"
      aria-controls="siteNavCollapse"
      aria-expanded="false"
      aria-label="Toggle navigation">
      <i class="fa-solid fa-bars" aria-hidden="true"></i>
    </button>
    <div class="collapse navbar-collapse" id="siteNavCollapse">
      <ul class="navbar-nav ms-auto">
        {% for item in site.data.nav.docs %}
          {% if item.url %}
            <li class="nav-item">
              <a
                class="nav-link"
                href="{{ site.baseurl }}{{ item.url }}"
                {% if item.icon-only %}aria-label="{{ item.title }}"{% endif %}
                {% unless item.url contains 'http' %}
                  {% if page.url contains item.url %}aria-current="page"{% endif %}
                {% endunless %}>
                {% if item.icon %}<i class="fa-solid {{ item.icon }}" aria-hidden="true"></i>{% endif %}{% unless item.icon-only %} {{ item.title }}{% endunless %}
              </a>
            </li>
          {% endif %}
        {% endfor %}
      </ul>
    </div>
  </div>
</nav>
