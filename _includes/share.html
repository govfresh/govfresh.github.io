<div class="share d-flex flex-wrap align-items-center gap-3 mb-1">
  <span class="text-body-secondary">
    Share:
  </span>
  <a
    href="https://www.linkedin.com/sharing/share-offsite/?url={{ site.url }}{{ page.url }}"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="Share on LinkedIn (opens in new tab)">
    <i class="fa-brands fa-linkedin fa-lg" aria-hidden="true"></i>
  </a>
  <a
    href="https://bsky.app/share?url={{ site.url }}{{ page.url }}"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="Share on Bluesky (opens in new tab)">
    <i class="fa-brands fa-bluesky fa-lg" aria-hidden="true"></i>
  </a>
  <a
    href="https://mastodon.social/share?url={{ site.url }}{{ page.url }}"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="Share on Mastodon (opens in new tab)">
    <i class="fa-brands fa-mastodon fa-lg" aria-hidden="true"></i>
  </a>
  <a
    href="https://twitter.com/intent/tweet?url={{ site.url }}{{ page.url }}"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="Share on X (opens in new tab)">
    <i class="fa-brands fa-x-twitter fa-lg" aria-hidden="true"></i>
  </a>
  <a
    href="https://www.facebook.com/sharer/sharer.php?u={{ site.url }}{{ page.url }}"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="Share on Facebook (opens in new tab)">
    <i class="fa-brands fa-facebook fa-lg" aria-hidden="true"></i>
  </a>
  <a
    href="mailto:?subject={{ page.title | url_encode }}&body={{ site.url }}{{ page.url }}"
    aria-label="Share via Email">
    <i class="fa-solid fa-envelope fa-lg" aria-hidden="true"></i>
  </a>
  <button type="button" class="share-copy-btn" onclick="copyLink()" aria-label="Copy link">
    <i class="fa-solid fa-link fa-lg" aria-hidden="true"></i>
  </button>
</div>
