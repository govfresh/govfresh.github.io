<div class="mt-4 pb-3">
  <h2>Subscribe</h2>
  <div class="row row-cols-2 row-cols-md-3 row-cols-lg-4 card-group">
    {% for item in site.data.subscribe-podcast.docs %}
      <div class="col">
        <div class="text-center card h-100"><div class="card-body">
          <a href="{{ item.url }}" aria-label="{{ item.title }}" class="body-link">
            <p class="mb-2">
              <i class="{{ item.icon }} {{ site.data.connect.md }}"></i>
            </p>
          </a>
          <p class="card-caption">{{ item.title }}</p>
        </div></div>
      </div>
    {% endfor %}
  </div>
</div>
